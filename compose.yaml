services:
  backend:
    build: ./BE
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://mysql:3306/khoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DATABASE_USERNAME: khoa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      DEMO_CHECKOUT_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./FE
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: khoa
      MYSQL_USER: khoa
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - khoa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  khoa_mysql:
