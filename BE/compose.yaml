# Giữ tên project để tiếp tục dùng volume MySQL khoa_khoa_mysql hiện tại.
name: khoa

services:
  backend:
    image: khoa-backend:latest
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://mysql:3306/khoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DATABASE_USERNAME: khoa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      DEMO_CHECKOUT_ENABLED: "true"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: khoa
      MYSQL_USER: khoa
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - khoa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  khoa_mysql:
