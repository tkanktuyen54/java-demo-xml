# Giữ tên project để tiếp tục dùng volume MySQL khoa_khoa_mysql hiện tại.
name: khoa

services:
  backend:
    image: khoa-backend:latest
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://mysql:3306/khoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DATABASE_USERNAME: khoa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      DEMO_CHECKOUT_ENABLED: "true"
      AI_SERVICE_URL: http://advisor:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    depends_on:
      advisor:
        condition: service_healthy
      mysql:
        condition: service_healthy

  advisor:
    build: ../AI
    image: khoa-advisor:latest
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_CATALOG_PATH: /app/imported/catalog.json
      AI_MODEL_PATH: ${AI_MODEL_PATH:-}
    volumes:
      - ../AI/data:/app/imported:ro
      - ../AI/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: khoa
      MYSQL_USER: khoa
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - khoa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  khoa_mysql:
